<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse3D // Advanced Fitness Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            perspective: 1200px;
            overflow-x: hidden;
        }
        .scene-3d { transform-style: preserve-3d; }
        .card-3d {
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }
        .card-3d:hover {
            transform: translateY(-6px) rotateX(4deg) rotateY(-2deg);
            box-shadow: -10px 25px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(139, 92, 246, 0.15);
        }
        .pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.08); }
        }
        .tab-active {
            background: linear-gradient(to right, #8b5cf6, #ec4899);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8 flex justify-center items-center">

    <div class="container max-w-6xl scene-3d">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 card-3d bg-slate-900/80 backdrop-blur-md p-6 rounded-2xl border border-violet-500/10">
            <div class="flex items-center gap-4">
                <div class="relative w-12 h-12 bg-gradient-to-tr from-violet-500 to-fuchsia-500 rounded-xl flex items-center justify-center shadow-lg transform rotate-6">
                    <i class="fa-solid fa-bolt text-xl text-white"></i>
                    <div class="absolute inset-0 bg-violet-500 rounded-xl pulse-glow -z-10"></div>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-fuchsia-400">PULSE MATRIX v2</h1>
                    <p class="text-[11px] text-slate-400 tracking-widest uppercase">Local-First Analytics Engine</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <button id="notiBtn" onclick="requestNotificationPermission()" class="px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl transition text-xs font-bold tracking-wide flex items-center gap-2">
                    <i id="notiIcon" class="fa-solid fa-bell text-violet-400"></i>
                    <span id="notiText">Enable Systems Push</span>
                </button>
                <div class="bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-orange-500/20 px-4 py-2 rounded-xl flex items-center gap-2">
                    <i class="fa-solid fa-fire text-orange-500"></i>
                    <span class="text-xs font-bold text-orange-400"><span id="streakCount">0</span> Day Streak</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <div class="lg:col-span-1 flex flex-col gap-6">
                
                <div class="card-3d bg-slate-900/90 backdrop-blur-md p-5 rounded-2xl border border-violet-500/10">
                    <h2 class="text-md font-bold mb-4 flex items-center gap-2 text-violet-400">
                        <i class="fa-solid fa-square-plus"></i> Initialize Workout Task
                    </h2>
                    
                    <form id="taskForm" onsubmit="handleAddTask(event)" class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Exercise Name</label>
                            <input type="text" id="taskName" required placeholder="e.g., Heavy Squats, HIIT Circuit" 
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-violet-500 transition shadow-inner">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Modality</label>
                                <select id="taskType" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-violet-500 transition">
                                    <option value="strength">🏋️‍♂️ Strength</option>
                                    <option value="cardio">🏃‍♂️ Cardio</option>
                                    <option value="flexibility">🧘‍♂️ Mobility</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Timer (Minutes)</label>
                                <input type="number" id="taskTimer" min="1" required placeholder="e.g., 20" 
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-violet-500 transition shadow-inner">
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-violet-500 to-fuchsia-500 hover:brightness-110 text-white font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-violet-500/10 transform transition active:scale-[0.98] flex justify-center items-center gap-2 text-sm">
                            <i class="fa-solid fa-play text-xs"></i> Deploy Task Timer
                        </button>
                    </form>
                </div>

                <div class="card-3d bg-slate-900/60 backdrop-blur-md p-5 rounded-2xl border border-slate-800 grid grid-cols-2 gap-4">
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/60">
                        <span class="text-[10px] font-semibold text-slate-500 block uppercase">Total Burn</span>
                        <span id="statCalories" class="text-lg font-black text-fuchsia-400">0</span> <span class="text-[10px] text-slate-400">XP</span>
                    </div>
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/60">
                        <span class="text-[10px] font-semibold text-slate-500 block uppercase">Completed</span>
                        <span id="statCount" class="text-lg font-black text-teal-400">0</span> <span class="text-[10px] text-slate-400">Sets</span>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 flex flex-col gap-4">
                
                <div class="flex gap-2 p-1.5 bg-slate-950 border border-slate-800 rounded-xl self-start">
                    <button onclick="switchTab('queue')" id="tabBtn-queue" class="px-4 py-2 text-xs font-bold rounded-lg transition-all tab-active flex items-center gap-2">
                        <i class="fa-solid fa-stopwatch"></i> Active Core
                    </button>
                    <button onclick="switchTab('charts')" id="tabBtn-charts" class="px-4 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line"></i> Analytics Matrix
                    </button>
                    <button onclick="switchTab('logs')" id="tabBtn-logs" class="px-4 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left"></i> History Log
                    </button>
                </div>

                <div id="tabContent-queue" class="card-3d bg-slate-900/40 backdrop-blur-md p-5 rounded-2xl border border-slate-800/80 min-h-[380px]">
                    <div id="taskQueue" class="space-y-4 max-h-[420px] overflow-y-auto pr-1">
                        <div id="emptyState" class="text-center py-24 text-slate-600 border-2 border-dashed border-slate-800/80 rounded-xl">
                            <i class="fa-solid fa-heart-pulse text-3xl mb-3 text-slate-700"></i>
                            <p class="text-xs">No active timers deployed. Set parameters on the left to initialize.</p>
                        </div>
                    </div>
                </div>

                <div id="tabContent-charts" class="card-3d bg-slate-900/40 backdrop-blur-md p-5 rounded-2xl border border-slate-800/80 min-h-[380px] hidden">
                    <div class="w-full h-[320px] relative flex items-center justify-center">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>

                <div id="tabContent-logs" class="card-3d bg-slate-900/40 backdrop-blur-md p-5 rounded-2xl border border-slate-800/80 min-h-[380px] hidden">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xs font-bold tracking-widest uppercase text-slate-400">Historical Operational Record</h3>
                        <button onclick="clearHistoryLog()" class="text-[10px] bg-red-500/10 border border-red-500/20 text-red-400 px-2 py-1 rounded hover:bg-red-500/20 transition">Wipe Ledger</button>
                    </div>
                    <div id="logContainer" class="space-y-2 max-h-[300px] overflow-y-auto text-xs pr-1">
                        </div>
                </div>

            </div>
        </div>
    </div>

    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-600.wav" preload="auto"></audio>

    <script>
        // System State Data Schemas
        let tasks = JSON.parse(localStorage.getItem('m2_tasks')) || [];
        let historyLog = JSON.parse(localStorage.getItem('m2_history')) || [];
        let streak = parseInt(localStorage.getItem('m2_streak')) || 0;
        let lastDate = localStorage.getItem('m2_last_date') || "";
        let currentTab = 'queue';
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            syncStreakFramework();
            renderTasks();
            populateHistoryLog();
            calculateGlobalMetrics();
            checkSystemNotificationStatus();
            initChartCore();
            
            // 1-second system clock tick
            setInterval(systemTick, 1000);
        });

        // Tab Navigation Engine
        function switchTab(targetTab) {
            document.getElementById(`tabContent-${currentTab}`).classList.add('hidden');
            document.getElementById(`tabBtn-${currentTab}`).className = "px-4 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200 flex items-center gap-2";
            
            currentTab = targetTab;
            
            document.getElementById(`tabContent-${currentTab}`).classList.remove('hidden');
            document.getElementById(`tabBtn-${currentTab}`).className = "px-4 py-2 text-xs font-bold rounded-lg transition-all tab-active flex items-center gap-2";
            
            if(targetTab === 'charts') {
                updateChartData();
            }
        }

        // Web Notifications API Engine (Mobile & Desktop Cross-Compatibility)
        function checkSystemNotificationStatus() {
            const btn = document.getElementById('notiBtn');
            if (!("Notification" in window)) {
                btn.style.display = 'none';
                return;
            }
            if (Notification.permission === "granted") {
                btn.className = "px-4 py-2 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-xs font-bold text-emerald-400 cursor-default flex items-center gap-2";
                document.getElementById('notiIcon').className = "fa-solid fa-shield-check text-emerald-400";
                document.getElementById('notiText').innerText = "System Synced";
                btn.onclick = null;
            }
        }

        function requestNotificationPermission() {
            Notification.requestPermission().then(perm => {
                if(perm === 'granted') {
                    checkSystemNotificationStatus();
                    new Notification("Matrix Link Online", {
                        body: "Notification arrays are synchronized across this browser environment.",
                        icon: "https://cdn-icons-png.flaticon.com/512/1045/1045218.png"
                    });
                }
            });
        }

        // Core Task Pipelines (CRUD Framework)
        function handleAddTask(e) {
            e.preventDefault();
            const name = document.getElementById('taskName');
            const type = document.getElementById('taskType');
            const timer = document.getElementById('taskTimer');

            const totalSeconds = parseInt(timer.value) * 60;
            
            const newTask = {
                id: 'tk_' + Date.now(),
                name: name.value,
                type: type.value,
                targetTime: Date.now() + (totalSeconds * 1000),
                totalDuration: totalSeconds,
                status: 'running'
            };

            tasks.push(newTask);
            saveStateToDisk();
            renderTasks();
            
            name.value = '';
            timer.value = '';
        }

        function systemTick() {
            let changesOccurred = false;
            tasks.forEach(task => {
                if(task.status === 'running') {
                    const remaining = Math.max(0, Math.ceil((task.targetTime - Date.now()) / 1000));
                    
                    const timeEl = document.getElementById(`time-${task.id}`);
                    const progressEl = document.getElementById(`progress-${task.id}`);
                    
                    if (timeEl && progressEl) {
                        timeEl.innerText = formatTime(remaining);
                        progressEl.style.width = `${((task.totalDuration - remaining) / task.totalDuration) * 100}%`;
                    }

                    if(remaining <= 0) {
                        task.status = 'triggered';
                        dispatchAlertBroadcast(task);
                        changesOccurred = true;
                    }
                }
            });

            if(changesOccurred) {
                saveStateToDisk();
                renderTasks();
            }
        }

        function dispatchAlertBroadcast(task) {
            document.getElementById('alertSound').play().catch(() => {});
            if(Notification.permission === 'granted') {
                new Notification(`Interval Expired!`, {
                    body: `Initiate execution: ${task.name}`,
                    requireInteraction: true,
                    tag: task.id
                });
            }
        }

        function completeTask(id) {
            const index = tasks.findIndex(t => t.id === id);
            if(index !== -1) {
                const target = tasks[index];
                
                // Track workout history ledger
                const xpCalculated = Math.round((target.totalDuration / 60) * 12);
                const historicalItem = {
                    name: target.name,
                    type: target.type,
                    xp: xpCalculated,
                    timestamp: new Date().toISOString(),
                    dateString: new Date().toLocaleDateString()
                };

                historyLog.unshift(historicalItem); // Prepend to history stack
                tasks.splice(index, 1); // Extract from running array
                
                processStreakLogic();
                saveStateToDisk();
                renderTasks();
                populateHistoryLog();
                calculateGlobalMetrics();
                if(currentTab === 'charts') updateChartData();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveStateToDisk();
            renderTasks();
        }

        // Metrics & Analytics Logic
        function calculateGlobalMetrics() {
            const totalXp = historyLog.reduce((acc, curr) => acc + curr.xp, 0);
            document.getElementById('statCalories').innerText = totalXp;
            document.getElementById('statCount').innerText = historyLog.length;
        }

        // Gamification Streak Verification Architecture
        function processStreakLogic() {
            const today = new Date().toDateString();
            if (lastDate !== today) {
                if (lastDate === new Date(Date.now() - 86400000).toDateString() || streak === 0) {
                    streak += 1;
                } else {
                    streak = 1;
                }
                lastDate = today;
                localStorage.setItem('m2_streak', streak);
                localStorage.setItem('m2_last_date', lastDate);
                syncStreakFramework();
            }
        }

        function syncStreakFramework() {
            document.getElementById('streakCount').innerText = streak;
        }

        function saveStateToDisk() {
            localStorage.setItem('m2_tasks', JSON.stringify(tasks));
            localStorage.setItem('m2_history', JSON.stringify(historyLog));
        }

        // DOM Rendering Framework
        function renderTasks() {
            const queue = document.getElementById('taskQueue');
            const emptyState = document.getElementById('emptyState');
            const activeRunning = tasks.filter(t => t.status === 'running' || t.status === 'triggered');

            if(activeRunning.length === 0) {
                emptyState.style.display = 'block';
                queue.querySelectorAll('.task-node').forEach(n => n.remove());
                return;
            }
            emptyState.style.display = 'none';

            activeRunning.forEach(task => {
                let node = document.getElementById(task.id);
                const remaining = Math.max(0, Math.ceil((task.targetTime - Date.now()) / 1000));
                let borderTheme = task.status === 'triggered' ? 'border-amber-500/40 bg-gradient-to-r from-amber-500/10 to-red-500/5 animate-pulse' : 'border-slate-800 bg-slate-950/60';

                const coreHTML = `
                    <div class="flex justify-between items-center gap-3">
                        <div class="flex items-center gap-3">
                            <span class="text-lg">${task.type === 'strength' ? '🏋️‍♂️' : task.type === 'cardio' ? '🏃‍♂️' : '🧘‍♂️'}</span>
                            <div>
                                <h4 class="text-xs font-bold tracking-wide text-slate-200 capitalize">${task.name}</h4>
                                <span class="text-[9px] text-slate-500 uppercase font-mono tracking-widest">${task.type}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            ${task.status === 'triggered' ? `
                                <button onclick="completeTask('${task.id}')" class="px-3 py-1 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold text-[10px] rounded-lg shadow-md hover:brightness-110 active:scale-95 transition">
                                    Complete
                                </button>
                            ` : `
                                <span id="time-${task.id}" class="font-mono text-xs bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800 text-violet-400 font-bold">${formatTime(remaining)}</span>
                            `}
                            <button onclick="deleteTask('${task.id}')" class="text-slate-600 hover:text-red-400 px-1 transition text-xs"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="w-full bg-slate-900 h-1 mt-3 rounded-full overflow-hidden">
                        <div id="progress-${task.id}" class="bg-gradient-to-r from-violet-500 to-fuchsia-500 h-full transition-all duration-1000 ease-linear" style="width: ${((task.totalDuration - remaining) / task.totalDuration) * 100}%"></div>
                    </div>
                `;

                if(node) {
                    if (task.status === 'triggered' && !node.classList.contains('animate-pulse')) {
                        node.className = `task-node card-3d p-4 rounded-xl border ${borderTheme}`;
                        node.innerHTML = coreHTML;
                    }
                } else {
                    const row = document.createElement('div');
                    row.id = task.id;
                    row.className = `task-node card-3d p-4 rounded-xl border ${borderTheme}`;
                    row.innerHTML = coreHTML;
                    queue.appendChild(row);
                }
            });

            queue.querySelectorAll('.task-node').forEach(el => {
                if(!tasks.find(t => t.id === el.id)) el.remove();
            });
        }

        function populateHistoryLog() {
            const container = document.getElementById('logContainer');
            if(historyLog.length === 0) {
                container.innerHTML = `<p class="text-slate-600 italic text-center py-8">No historical exercises cataloged.</p>`;
                return;
            }
            container.innerHTML = historyLog.map(item => `
                <div class="flex justify-between items-center bg-slate-950/80 p-2.5 border border-slate-900 rounded-lg">
                    <span class="font-medium text-slate-300">${item.name} <span class="text-[9px] text-slate-500 font-mono">(${item.type})</span></span>
                    <div class="text-right">
                        <span class="text-fuchsia-400 font-bold block">+${item.xp} XP</span>
                        <span class="text-[8px] text-slate-500 block">${item.dateString}</span>
                    </div>
                </div>
            `).join('');
        }

        function clearHistoryLog() {
            if(confirm("Confirm structural purge of historical metrics data?")) {
                historyLog = [];
                saveStateToDisk();
                populateHistoryLog();
                calculateGlobalMetrics();
                if(currentTab === 'charts') updateChartData();
            }
        }

        // Chart.js Visualization Layer Architecture
        function initChartCore() {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'XP Generated',
                        data: [],
                        backgroundColor: 'rgba(139, 92, 246, 0.4)',
                        borderColor: 'rgba(236, 72, 153, 0.8)',
                        borderWidth: 2,
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { size: 9 } } },
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 } } }
                    }
                }
            });
        }

        function updateChartData() {
            if(!chartInstance) return;

            // Generate map of the past 7 calendar intervals
            const analyticalMap = {};
            for(let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                analyticalMap[d.toLocaleDateString()] = 0;
            }

            // Aggregate operational history metrics
            historyLog.forEach(log => {
                if(analyticalMap[log.dateString] !== undefined) {
                    analyticalMap[log.dateString] += log.xp;
                }
            });

            chartInstance.data.labels = Object.keys(analyticalMap);
            chartInstance.data.datasets[0].data = Object.values(analyticalMap);
            chartInstance.update();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
    </script>
</body>
</html>
